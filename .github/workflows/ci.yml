name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore server/SmartParking.Tests/SmartParking.Tests.csproj --locked-mode
      - run: dotnet build server/SmartParking.Tests/SmartParking.Tests.csproj --no-restore --configuration Release
      - run: dotnet test server/SmartParking.Tests/SmartParking.Tests.csproj --no-build --configuration Release
  analyzer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [aerial, coco]
    env:
      YOLO_MODEL_PROFILE: ${{ matrix.profile }}
      YOLO_MODEL_PATH: .models/ci-model.pt
      YOLO_CONFIG_DIR: .ultralytics
      MPLCONFIGDIR: .ultralytics/matplotlib
      YOLO_DEVICE: cpu
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.download_model --profile ${{ matrix.profile }} --output .models/ci-model.pt
      - run: python -m pytest
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare disposable test configuration
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: python scripts/smoke_test.py --base-url http://localhost:3000
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable test services
        if: always()
        run: docker compose down -v
